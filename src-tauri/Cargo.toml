[package]
name = "power-interview-ai"
version = "2.0.0"
description = "AI-powered live interview assistant"
authors = ["Power Interview AI"]
edition = "2021"

[lib]
name = "power_interview_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
xcap = "0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
futures-util = "0.3"
base64 = "0.22"
os_info = "3"
# WebSocket client for streaming loopback PCM to the ASR endpoint. native-tls keeps
# the TLS backend consistent with reqwest (schannel on Windows, Secure Transport on macOS).
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# Windows system-audio (loopback) capture. cpal opens the default render endpoint as an
# input device, which WASAPI transparently captures in loopback mode.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSButton"] }
# macOS system-audio capture via ScreenCaptureKit.
screencapturekit = "1.5"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
